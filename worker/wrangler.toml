name = "ai-travel-concierge"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "USER_MEMORY"
class_name = "UserMemory"
script_name = "ai-travel-concierge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserMemory"]

[vars]
ENVIRONMENT = "production"

# UNSPLASH_ACCESS_KEY is a secret, not a var.
#   deployed: npx wrangler secret put UNSPLASH_ACCESS_KEY
#   local:    put it in worker/.dev.vars (gitignored)
# Without it, /api/generate still works and simply returns no photos.
