<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Agent — AI Assisted Trip Planning</title>
    <meta name="description" content="Trip plans built from real sources: Wikipedia, Wikivoyage and the ERA5 climate archive." />

    <!-- Fonts belong here, not in CSS. An @import inside index.css lands after
         Tailwind's expanded output, and CSS requires @import to precede all
         other statements — so the browser silently dropped it and every face
         fell back to Georgia / system-ui. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
